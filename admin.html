<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Collected Mobile Numbers - Admin</title>
  <style>
    :root {
      --bg: #0b0e0f;
      --card: #1a1d1f;
      --border: rgba(255, 255, 255, 0.1);
      --text: #ffffff;
      --muted: #868c92;
      --blue: #229ed9;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      padding: 24px 16px;
      min-height: 100vh;
    }
    .container {
      max-width: 920px;
      margin: 0 auto;
    }
    .header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 1.4rem;
      font-weight: 700;
    }
    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .btn {
      background: var(--blue);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn.secondary {
      background: #272b2e;
      border: 1px solid var(--border);
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }
    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
    }
    .stat-label {
      font-size: 0.78rem;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .stat-value {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--blue);
    }
    .toolbar {
      margin-bottom: 14px;
    }
    .search-input {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      color: #fff;
      font-size: 0.94rem;
      outline: none;
    }
    .search-input:focus {
      border-color: var(--blue);
    }
    .table-wrap {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.9rem;
    }
    th, td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    th {
      color: var(--muted);
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    tr:last-child td {
      border-bottom: none;
    }
    .empty {
      padding: 36px 16px;
      text-align: center;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Collected Mobile Numbers</h1>
      <div class="actions">
        <button id="refreshBtn" class="btn secondary" type="button">Refresh</button>
        <a id="downloadCsvBtn" href="/api/numbers.csv" class="btn">Download CSV</a>
      </div>
    </div>

    <div class="stats">
      <div class="stat-card">
        <div class="stat-label">Total Numbers</div>
        <div id="totalCount" class="stat-value">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Today</div>
        <div id="todayCount" class="stat-value">0</div>
      </div>
    </div>

    <div class="toolbar">
      <input id="searchInput" class="search-input" type="search" placeholder="Search by mobile number or date...">
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Mobile Number</th>
            <th>Country</th>
            <th>Submitted At</th>
            <th>IP</th>
          </tr>
        </thead>
        <tbody id="numbersBody">
          <tr><td colspan="5" class="empty">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    (function() {
      const totalCountEl = document.getElementById('totalCount');
      const todayCountEl = document.getElementById('todayCount');
      const numbersBody = document.getElementById('numbersBody');
      const searchInput = document.getElementById('searchInput');
      const refreshBtn = document.getElementById('refreshBtn');

      let allNumbers = [];

      function renderTable(items) {
        if (!items.length) {
          numbersBody.innerHTML = '<tr><td colspan="5" class="empty">No mobile numbers recorded yet.</td></tr>';
          return;
        }
        numbersBody.innerHTML = items.map(function(item, idx) {
          const dt = item.submittedAt ? new Date(item.submittedAt).toLocaleString() : '-';
          return '<tr>' +
            '<td>' + (idx + 1) + '</td>' +
            '<td><strong>' + escapeHtml(item.fullNumber || item.number) + '</strong></td>' +
            '<td>' + escapeHtml(item.countryCode || '-') + '</td>' +
            '<td>' + escapeHtml(dt) + '</td>' +
            '<td>' + escapeHtml(item.ip || '-') + '</td>' +
          '</tr>';
        }).join('');
      }

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function updateStats(items) {
        totalCountEl.textContent = items.length;
        const todayPrefix = new Date().toISOString().slice(0, 10);
        const todayTotal = items.filter(function(i) {
          return (i.submittedAt || '').startsWith(todayPrefix);
        }).length;
        todayCountEl.textContent = todayTotal;
      }

      async function loadNumbers() {
        try {
          const res = await fetch('/api/numbers');
          if (!res.ok) throw new Error('Failed to load');
          const data = await res.json();
          allNumbers = data.numbers || [];
          updateStats(allNumbers);
          applyFilter();
        } catch (err) {
          numbersBody.innerHTML = '<tr><td colspan="5" class="empty">Unable to load from server. Make sure server.js is running.</td></tr>';
        }
      }

      function applyFilter() {
        const q = (searchInput.value || '').trim().toLowerCase();
        if (!q) {
          renderTable(allNumbers);
          return;
        }
        const filtered = allNumbers.filter(function(item) {
          return (item.fullNumber || '').toLowerCase().includes(q) ||
                 (item.number || '').toLowerCase().includes(q) ||
                 (item.submittedAt || '').toLowerCase().includes(q);
        });
        renderTable(filtered);
      }

      searchInput.addEventListener('input', applyFilter);
      refreshBtn.addEventListener('click', loadNumbers);

      loadNumbers();
    })();
  </script>
</body>
</html>
